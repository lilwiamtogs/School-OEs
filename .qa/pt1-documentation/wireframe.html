<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #eef1f3; font-family: Arial, sans-serif; color: #27313a; }
  .frame { width: 760px; margin: 28px auto; padding: 24px; background: white; border: 2px solid #60717e; }
  .label { margin: 0 0 8px; font-size: 14px; font-weight: 700; color: #425563; text-transform: uppercase; letter-spacing: .08em; }
  .box { display: flex; align-items: center; justify-content: center; min-height: 72px; margin-bottom: 18px; border: 2px dashed #7a8b97; background: #f7f9fa; font-weight: 700; }
  .hero { min-height: 125px; background: #e8eef2; }
  .content { min-height: 105px; }
  .events { min-height: 165px; }
  .contact { min-height: 125px; }
  .footer { min-height: 55px; margin-bottom: 0; background: #e8eef2; }
</style>
</head>
<body>
  <main class="frame">
    <p class="label">Sunnydale School single page wireframe</p>
    <div class="box hero">Header: School title and introductory tagline</div>
    <div class="box content">Mission Statement: heading and descriptive text</div>
    <div class="box events">Upcoming Events: heading and four-item event list</div>
    <div class="box contact">Contact Us: email, telephone number, and office hours</div>
    <div class="box footer">Footer: copyright notice</div>
  </main>
</body>
</html>
